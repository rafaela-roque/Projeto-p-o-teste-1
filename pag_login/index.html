<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head>

<body class="base_login">
     <header class="cabecalho">
        <div class="container_cabecalho">
            <a href="index.html" class="logo" aria-label="Pequeno Forno, página inicial">
                <svg viewBox="284 36 112 112" aria-hidden="true">
                    <rect x="288" y="40" width="104" height="104" rx="16" fill="none" stroke="currentColor" stroke-width="3"/>
                    <line x1="306" y1="62" x2="374" y2="62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M308 130 V102 a32 32 0 0 1 64 0 V130 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                    <ellipse cx="340" cy="118" rx="17" ry="9" fill="currentColor"/>
                    <line x1="332" y1="114" x2="336" y2="122" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                    <line x1="340" y1="113" x2="344" y2="121" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span class="logo-texto">
                    <strong>pequeno forno</strong>
                    <small>pães artesanais</small>
                </span>
            </a>
            
            <a href="index.html" class="voltar">
                <i class="ti ti-arrow-left"></i> Voltar ao site
            </a>
        </div>
    </header>
    
    <div class="conteudo">
        <main class="card">
            <h2>Entrar</h2>
            
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email required">
            </div>
            
            <div class="campo">
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
            </div>
            <p class="esqueci"><a href="#">Esqueci a senha</a></p>
            
            <button type="submit" class="botao">Entrar</button>
        </main>
        
        <p class="cadastro">Ainda não tem uma conta? <a href="#">Criar conta</a></p>
        
        <div class="contato">
            <p>Fale com a gente</p>
            
            <div class="redes">
                <a href="https://instagram.com/SEUUSUARIO" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="ti ti-brand-instagram" aria-hidden="true"></i>
                </a>
                <a href="https://wa.me/5511999999999" target="_blank" rel="noopener" aria-label="WhatsApp">
                    <i class="ti ti-brand-whatsapp" aria-hidden="true"></i>
                </a>
                <a href="https://facebook.com/SEUUSUARIO" target="_blank" rel="noopener" aria-label="Facebook">
                    <i class="ti ti-brand-facebook" aria-hidden="true"></i>
                </a>
                <a href="mailto:contato@seudominio.com" aria-label="E-mail">
                    <i class="ti ti-mail" aria-hidden="true"></i>
                </a>
            </div>
        </div>
    </div>
    </body>

</html>
